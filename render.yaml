databases:
  - name: Django1db
    plan: free
    databaseName: 'postgres'
    user: 'postgres'

services:
  - type: web
    plan: free
    name: Django1
    runtime: python
    buildCommand: './build.sh'
    # startCommand: 'python -m gunicorn Django1.asgi:application -k uvicorn.workers.UvicornWorker'
    startCommand: waitress-serve --port=8000 Django1.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: Django1db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4