services:
  - type: web
    name: django-web
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: |
      python manage.py migrate && gunicorn Django1.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: Django1.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: django-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: django-db
          property: connectionString
    plan: free

databases:
  - name: django-db
    databaseName: django_db
    user: django_user
    plan: free